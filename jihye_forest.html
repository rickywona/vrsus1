<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>지혜의 숲 — 인생선배 5분 대화</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F4EF;
  --ink:#1A1410;
  --ink2:#4A3F35;
  --ink3:#8A7A6E;
  --border:#E0D8CE;
  --white:#FFFFFF;
}
html,body{min-height:100%;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink)}

.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ══ STEP 1 ══ */
#s1{background:var(--bg);align-items:center;justify-content:center;padding:2rem 1.5rem}
.s1-inner{width:100%;max-width:420px}
.forest-label{font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:0.22em;text-transform:uppercase;margin-bottom:12px;text-align:center}
.s1-title{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:700;color:var(--ink);text-align:center;line-height:1.45;margin-bottom:6px}
.s1-sub{font-size:13px;color:var(--ink3);text-align:center;line-height:1.7;margin-bottom:28px}
.worry-box{width:100%;min-height:140px;background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:16px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--ink);resize:none;outline:none;line-height:1.7;transition:border-color .2s}
.worry-box:focus{border-color:#8B7355}
.worry-box::placeholder{color:var(--ink3)}
.example-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;margin-bottom:24px}
.chip{padding:6px 12px;background:var(--white);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--ink2);cursor:pointer;transition:all .15s}
.chip:hover{background:#EDE5D8;border-color:#C8B89A}
.s1-btn{width:100%;padding:14px;background:var(--ink);color:var(--white);border:none;border-radius:14px;font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:0.04em;transition:background .15s}
.s1-btn:hover{background:#2D2520}

/* ══ STEP 2 ══ */
#s2{background:var(--bg);padding:0 0 40px}
.s2-header{padding:20px 20px 16px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.s2-back{font-size:12px;color:var(--ink3);cursor:pointer;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px}
.s2-title{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;color:var(--ink);margin-bottom:4px}
.s2-worry-preview{font-size:12px;color:var(--ink3);background:rgba(139,115,85,0.08);border-radius:8px;padding:7px 10px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sage-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 14px 0}
.sage-card{border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.sage-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.14)}
.sage-card:active{transform:scale(0.97)}
.card-top{padding:16px 14px 12px;position:relative;min-height:170px;display:flex;flex-direction:column}
.card-num{font-size:11px;font-weight:700;opacity:0.7;margin-bottom:6px;color:rgba(255,255,255,0.8)}
.card-badge{position:absolute;top:14px;right:12px;background:rgba(255,255,255,0.9);border-radius:20px;padding:3px 9px;font-size:10px;font-weight:600;color:#333}
.card-name-en{font-size:9px;letter-spacing:0.12em;opacity:0.55;margin-bottom:2px;font-weight:500;color:rgba(255,255,255,0.7)}
.card-title-label{font-size:10px;font-weight:500;opacity:0.75;margin-bottom:3px;color:rgba(255,255,255,0.7)}
.card-name{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;line-height:1.2;color:white}
.card-illust{flex:1;display:flex;align-items:center;justify-content:center;font-size:42px;margin-top:6px}
.card-bottom{padding:10px 14px 14px;min-height:60px;display:flex;align-items:center}
.card-desc{font-size:11px;font-weight:500;line-height:1.5;text-align:center;width:100%}

.c-seneca .card-top{background:#E8520A}
.c-seneca .card-bottom{background:#F5A623}
.c-seneca .card-desc{color:#7A3200}
.c-nietzsche .card-top{background:#3355CC}
.c-nietzsche .card-bottom{background:#66EE66}
.c-nietzsche .card-desc{color:#1A4400}
.c-laotzu .card-top{background:#6633CC}
.c-laotzu .card-bottom{background:#44DDAA}
.c-laotzu .card-desc{color:#003322}
.c-confucius .card-top{background:#CC1177}
.c-confucius .card-bottom{background:#AACCFF}
.c-confucius .card-desc{color:#002266}
.c-schopenhauer .card-top{background:#E85520}
.c-schopenhauer .card-bottom{background:#88EEDD}
.c-schopenhauer .card-desc{color:#003322}
.c-mill .card-top{background:#CC22BB}
.c-mill .card-bottom{background:#CCFF44}
.c-mill .card-desc{color:#334400}
.c-wittgenstein .card-top{background:#119955}
.c-wittgenstein .card-bottom{background:#FFEE22}
.c-wittgenstein .card-desc{color:#443300}
.c-goethe .card-top{background:#CC1133}
.c-goethe .card-bottom{background:#FFAACC}
.c-goethe .card-desc{color:#440011}
.c-arendt .card-top{background:#9922CC}
.c-arendt .card-bottom{background:#99FF66}
.c-arendt .card-desc{color:#1A3300}
.c-fromm .card-top{background:#EE2266}
.c-fromm .card-bottom{background:#66DDFF}
.c-fromm .card-desc{color:#003344}

/* ══ STEP 3: 연결 가이드 ══ */
#s3{background:var(--bg);align-items:center;justify-content:center;padding:2rem 1.5rem}
.s3-inner{width:100%;max-width:420px}

.sage-profile-card{border-radius:20px;overflow:hidden;margin-bottom:20px;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
.spc-top{padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.spc-illust{font-size:56px;margin-bottom:10px}
.spc-badge{font-size:10px;font-weight:600;background:rgba(255,255,255,0.25);border-radius:20px;padding:3px 10px;color:white;margin-bottom:8px}
.spc-name{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:700;color:white;margin-bottom:4px}
.spc-name-en{font-size:11px;color:rgba(255,255,255,0.65);letter-spacing:0.12em}
.spc-bottom{padding:14px 18px 16px}
.spc-tagline{font-size:13px;font-weight:500;text-align:center;line-height:1.6}
.spc-intro{font-size:12px;color:var(--ink3);text-align:center;margin-top:8px;line-height:1.65;font-style:italic;font-family:'Noto Serif KR',serif}

.prompt-box{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.pb-label{font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px}
.pb-text{font-size:13px;color:var(--ink2);line-height:1.7;font-family:'Noto Serif KR',serif;background:var(--bg);border-radius:8px;padding:12px 14px;border:1px solid var(--border)}
.pb-copy-btn{width:100%;margin-top:10px;padding:10px;background:var(--ink);color:var(--white);border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.pb-copy-btn:hover{background:#2D2520}
.pb-copy-btn.copied{background:#2D6B42}

.claude-btn{width:100%;padding:14px;background:#CC785C;color:white;border:none;border-radius:14px;font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:0.04em;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;text-decoration:none}
.claude-btn:hover{background:#B5614A}

.how-to{background:rgba(139,115,85,0.08);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.ht-title{font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:8px;letter-spacing:0.06em}
.ht-steps{display:flex;flex-direction:column;gap:6px}
.ht-step{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink3);line-height:1.55}
.ht-num{width:18px;height:18px;border-radius:50%;background:var(--ink3);color:white;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;margin-top:1px}

.back-btn-bottom{width:100%;padding:11px;background:transparent;color:var(--ink3);border:1px solid var(--border);border-radius:14px;font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer}
.back-btn-bottom:hover{background:var(--white)}
</style>
</head>
<body>

<!-- ══ STEP 1 ══ -->
<div id="s1" class="screen active">
  <div class="s1-inner">
    <div class="forest-label">🌿 지혜의 숲</div>
    <div class="s1-title">오늘 어떤 고민을<br>가지고 오셨나요?</div>
    <div class="s1-sub">털어놓으면, 당신에게 맞는<br>인생선배를 찾아드릴게요</div>
    <textarea class="worry-box" id="worryInput" placeholder="지금 마음속에 있는 것을 자유롭게 적어보세요.&#10;예) 퇴사하고 싶은데 용기가 안 나요&#10;    나만 뒤처지는 것 같아요&#10;    아무것도 하기 싫어요"></textarea>
    <div class="example-chips">
      <div class="chip" onclick="fillWorry('퇴사하고 싶은데 용기가 안 나요')">퇴사 고민</div>
      <div class="chip" onclick="fillWorry('나만 뒤처지는 것 같아요')">뒤처지는 느낌</div>
      <div class="chip" onclick="fillWorry('아무것도 하기 싫어요')">무기력함</div>
      <div class="chip" onclick="fillWorry('친구가 점점 멀어지는 것 같아요')">관계 고민</div>
      <div class="chip" onclick="fillWorry('돈이 없으면 행복할 수 없는 건가요')">돈과 행복</div>
      <div class="chip" onclick="fillWorry('30대인데 아직도 내가 뭘 하고 싶은지 모르겠어요')">정체성 고민</div>
    </div>
    <button class="s1-btn" onclick="goToSageSelect()">인생선배 찾기 →</button>
  </div>
</div>

<!-- ══ STEP 2 ══ -->
<div id="s2" class="screen">
  <div class="s2-header">
    <div class="s2-back" onclick="showScreen(1)">← 다시 쓰기</div>
    <div class="s2-title">누구에게 물어볼까요?</div>
    <div class="s2-worry-preview" id="worryPreview"></div>
  </div>
  <div class="sage-grid" id="sageGrid"></div>
</div>

<!-- ══ STEP 3 ══ -->
<div id="s3" class="screen">
  <div class="s3-inner">
    <div class="sage-profile-card" id="profileCard">
      <div class="spc-top" id="profileTop">
        <div class="spc-illust" id="profileIllust"></div>
        <div class="spc-badge">인생선배 5분 대화</div>
        <div class="spc-name" id="profileName"></div>
        <div class="spc-name-en" id="profileEn"></div>
      </div>
      <div class="spc-bottom" id="profileBottom">
        <div class="spc-tagline" id="profileTagline"></div>
        <div class="spc-intro" id="profileIntro"></div>
      </div>
    </div>

    <div class="how-to">
      <div class="ht-title">이렇게 대화하세요</div>
      <div class="ht-steps">
        <div class="ht-step"><div class="ht-num">1</div><span>아래 프롬프트를 복사하세요</span></div>
        <div class="ht-step"><div class="ht-num">2</div><span>Claude.ai 채팅창에 붙여넣고 전송하세요</span></div>
        <div class="ht-step"><div class="ht-num">3</div><span>인생선배와 자유롭게 대화하세요</span></div>
      </div>
    </div>

    <div class="prompt-box">
      <div class="pb-label">대화 시작 프롬프트</div>
      <div class="pb-text" id="promptText"></div>
      <button class="pb-copy-btn" id="copyBtn" onclick="copyPrompt()">
        <span>📋</span> 프롬프트 복사하기
      </button>
    </div>

    <a class="claude-btn" href="https://claude.ai" target="_blank">
      <span>🌿</span> Claude.ai 열기
    </a>

    <button class="back-btn-bottom" onclick="showScreen(2)">← 다른 선배 선택하기</button>
  </div>
</div>

<script>
const SAGES = [
  {
    id:"seneca", num:"01", nameKo:"세네카", nameEn:"Seneca", cls:"c-seneca",
    emoji:"🪞",
    tagline:"나만 제자리 걸음인 것 같을 때 읽는 책",
    intro:"시간의 주인이 되는 법, 불안을 다스리는 법을 함께 이야기해봅시다.",
    topBg:"#E8520A", bottomBg:"#F5A623", descColor:"#7A3200",
    persona:`지금부터 당신은 고대 로마의 스토아 철학자 세네카입니다. 한국의 현대인과 대화하며 시간의 가치, 불안 다스리기, 현재에 충실한 삶에 대한 지혜를 나눠주세요. 짧고 깊은 문장으로, 설교하지 않고 옆에 앉은 선배처럼 따뜻하게 말해주세요. 반드시 한국어로 대화하세요.`
  },
  {
    id:"nietzsche", num:"02", nameKo:"니체", nameEn:"Nietzsche", cls:"c-nietzsche",

    persona:`지금부터 당신은 철학자 니체입니다. 무기력함과 허무감을 겪는 현대 한국인에게 자신의 힘을 발견하도록 도와주세요. 도전적이지만 따뜻하게, 설교 없이 직접적으로 말해주세요. 반드시 한국어로 대화하세요.`
  },
  {
    id:"laotzu", num:"03", nameKo:"노자", nameEn:"Lao Tzu", cls:"c-laotzu",

    persona:`지금부터 당신은 도가 철학자 노자입니다. 과도한 경쟁과 성취 압박에 지친 현대 한국인에게 무위자연의 지혜를 나눠주세요. 부드럽고 시적으로, 억지 없이 흐르듯 말해주세요. 반드시 한국어로 대화하세요.`
  },
  {
    id:"confucius", num:"04", nameKo:"공자", nameEn:"Confucius", cls:"c-confucius",
    emoji:"🪭",
    tagline:"사람이 제일 어려울 때 꺼내 보는 책",
    intro:"사람과의 관계, 도리, 그리고 나다운 삶에 대해 이야기해봅시다.",

    persona:`지금부터 당신은 공자입니다. 인간관계, 예의, 도리에 대한 지혜를 현대 한국인의 일상에 맞게 풀어주세요. 따뜻하지만 단호하게, 관계의 본질에 대해 이야기해주세요. 반드시 한국어로 대화하세요.`
  },
  {
    id:"schopenhauer", num:"05", nameKo:"쇼펜하우어", nameEn:"Schopenhauer", cls:"c-schopenhauer",

    topBg:"#119955", bottomBg:"#FFEE22", descColor:"#443300",
    persona:`지금부터 당신은 비트겐슈타인입니다. 언어와 생각, 표현에 대한 철학적 통찰을 현대 한국인의 일상 언어로 풀어주세요. 정확하고 깊이 있게, 하지만 따뜻하게 말해주세요. 반드시 한국어로 대화하세요.`
  },
  {
    id:"goethe", num:"08", nameKo:"괴테", nameEn:"Goethe", cls:"c-goethe",
    emoji:"🌸",
    tagline:"매일의 작고 치열한 노력을 위대한 성장으로 바꿔주는 책",
    intro:"꾸준한 노력, 성장, 그리고 삶을 작품처럼 만드는 법에 대해 이야기합시다.",
    topBg:"#CC1133", bottomBg:"#FFAACC", descColor:"#440011",
    persona:`지금부터 당신은 괴테입니다. 꾸준한 노력과 성장, 삶을 예술처럼 만들어가는 지혜를 현대 한국인과 나눠주세요. 열정적이면서도 따뜻하게, 구체적인 조언을 해주세요. 반드시 한국어로 대화하세요.`

  {

let currentWorry = "";
let currentSage = null;

function $(id){return document.getElementById(id)}

function showScreen(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('s'+n).classList.add('active');
  window.scrollTo(0,0);
}

function fillWorry(text){$('worryInput').value=text}

function goToSageSelect(){
  const w=$('worryInput').value.trim();
  if(!w){alert('고민을 입력해주세요 🌿');return;}
  currentWorry=w;
  $('worryPreview').textContent='"'+w.slice(0,40)+(w.length>40?'…':'"');
  renderGrid();
  showScreen(2);
}

function renderGrid(){
  const grid=$('sageGrid');
  grid.innerHTML='';
  SAGES.forEach(sg=>{
    const card=document.createElement('div');
    card.className=`sage-card ${sg.cls}`;
    card.innerHTML=`
      <div class="card-top">
        <div class="card-num">${sg.num}</div>
        <span class="card-badge">인생선배 5분 대화</span>
        <div class="card-name-en">${sg.nameEn}</div>
        <div class="card-title-label">인생선배</div>
        <div class="card-name">${sg.nameKo}</div>
        <div class="card-illust">${sg.emoji}</div>
      </div>
      <div class="card-bottom">
        <div class="card-desc">${sg.tagline}</div>
      </div>`;
    card.onclick=()=>selectSage(sg);
    grid.appendChild(card);
  });
}

function selectSage(sage){
  currentSage=sage;

  $('profileTop').style.background=sage.topBg;
  $('profileBottom').style.background=sage.bottomBg;
  $('profileIllust').textContent=sage.emoji;
  $('profileName').textContent=sage.nameKo;
  $('profileEn').textContent=sage.nameEn;
  $('profileTagline').style.color=sage.descColor;
  $('profileTagline').textContent=sage.tagline;
  $('profileIntro').textContent='"'+sage.intro+'"';

  const prompt=`${sage.persona}

나의 고민: "${currentWorry}"

위의 고민에 대해 ${sage.nameKo}의 시각으로 먼저 따뜻하게 말을 건네주세요. 3-5문장으로 시작한 뒤, 나와 계속 대화를 나눠주세요.`;

  $('promptText').textContent=prompt;
  $('copyBtn').textContent='📋 프롬프트 복사하기';
  $('copyBtn').classList.remove('copied');

  showScreen(3);
}

function copyPrompt(){
  const text=$('promptText').textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>{
      const btn=$('copyBtn');
      btn.innerHTML='✅ 복사됐어요! Claude.ai에 붙여넣기 하세요';
      btn.classList.add('copied');
      setTimeout(()=>{
        btn.innerHTML='📋 프롬프트 복사하기';
        btn.classList.remove('copied');
      },3000);
    });
  } else {
    const el=document.createElement('textarea');
    el.value=text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    const btn=$('copyBtn');
    btn.innerHTML='✅ 복사됐어요!';
    btn.classList.add('copied');
    setTimeout(()=>{
      btn.innerHTML='📋 프롬프트 복사하기';
      btn.classList.remove('copied');
    },3000);
  }
}
