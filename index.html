<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#F0EEE9;min-height:100%}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:#F0EEE9;
  min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;
  padding:2rem 1rem 4rem;
}
.card{
  width:100%;max-width:480px;
  background:#fff;
  border-radius:24px;
  border:1px solid #E4E2DC;
  overflow:hidden;
}

/* 헤더 */
.top-bar{
  background:#1A1930;
  padding:18px 24px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;letter-spacing:0.12em}
.brand span{color:#7F77DD}
.top-meta{font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:0.14em;text-align:right;line-height:1.6}

/* 진행바 */
.prog-wrap{padding:16px 24px 0}
.prog-bg{height:3px;background:#F0EEE9;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:#534AB7;border-radius:2px;transition:width .4s ease}
.prog-label{font-size:11px;color:#888;margin-top:6px;text-align:right}

/* 질문 */
.q-body{padding:20px 24px 16px}
.q-num{font-size:10px;font-weight:500;color:#534AB7;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:8px}
.q-text{font-size:16px;font-weight:500;color:#1A1930;line-height:1.6;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  width:100%;padding:12px 16px;
  border:1px solid #E4E2DC;border-radius:10px;
  background:#fff;font-family:'Noto Sans KR',sans-serif;
  font-size:14px;color:#1A1930;text-align:left;cursor:pointer;
  transition:all .15s;line-height:1.45;
}
.opt:hover{background:#F5F4FF;border-color:#AFA9EC}
.opt.sel{background:#EEEDFE;border-color:#534AB7;color:#26215C}

.nav-row{padding:10px 24px 20px;display:flex;justify-content:space-between;align-items:center}
.back-btn{font-size:12px;color:#888;background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 0}
.back-btn:hover{color:#1A1930}

/* 로딩 */
.loading{padding:48px 24px;text-align:center;display:none}
.spinner{width:36px;height:36px;border:2px solid #E4E2DC;border-top-color:#534AB7;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:#888}

/* 결과 */
.result{display:none}

.map-section{padding:20px 24px 0}
.sec-label{font-size:10px;font-weight:500;color:#888;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:12px;text-align:center}
.map-svg-wrap{position:relative;width:100%;padding-bottom:100%}
.map-svg-wrap svg{position:absolute;inset:0;width:100%;height:100%}

.type-card{margin:16px 24px 0;border-radius:14px;padding:16px 18px}
.tc-badge{font-size:10px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px}
.tc-name{font-size:20px;font-weight:500;margin-bottom:6px}
.tc-desc{font-size:13px;line-height:1.65}

.stats-row{display:flex;gap:8px;margin:12px 24px 0}
.stat-box{flex:1;background:#F5F4F1;border-radius:10px;padding:10px 8px;text-align:center}
.stat-val{font-size:20px;font-weight:500;color:#1A1930;display:block;line-height:1.1}
.stat-lbl{font-size:10px;color:#888;margin-top:3px}

.topics-section{margin:16px 24px 0;border:1px solid #E4E2DC;border-radius:14px;overflow:hidden}
.ts-head{padding:12px 16px;background:#F5F4F1;font-size:11px;font-weight:500;color:#555;letter-spacing:0.1em;text-transform:uppercase}
.ts-item{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-top:1px solid #E4E2DC;font-size:13px;color:#1A1930}
.ts-badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:8px}
.badge-hot{background:#FAECE7;color:#712B13}
.badge-fit{background:#EEEDFE;color:#3C3489}

/* 공유 섹션 */
.share-section{padding:16px 24px 24px}
.share-title{font-size:11px;font-weight:500;color:#888;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px;text-align:center}
.share-link-wrap{
  display:flex;align-items:center;gap:8px;
  background:#F5F4F1;border:1px solid #E4E2DC;
  border-radius:10px;padding:10px 14px;
  margin-bottom:10px;
}
.share-link-text{flex:1;font-size:12px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace}
.copy-btn{
  flex-shrink:0;padding:6px 12px;
  background:#534AB7;color:#fff;
  border:none;border-radius:7px;
  font-size:12px;font-weight:500;
  font-family:'Noto Sans KR',sans-serif;cursor:pointer;
  transition:background .15s;
}
.copy-btn:hover{background:#3C3489}
.copy-btn.copied{background:#1D9E75}

.share-btns{display:flex;flex-direction:column;gap:8px}
.btn-kakao{
  width:100%;padding:13px;
  background:#FEE500;color:#1A1A1A;
  border:none;border-radius:12px;
  font-family:'Noto Sans KR',sans-serif;
  font-size:14px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-kakao:hover{background:#F5DB00}
.kakao-icon{width:20px;height:20px;background:#1A1A1A;border-radius:50%;display:flex;align-items:center;justify-content:center}
.kakao-icon svg{width:12px;height:12px}

.btn-link{
  width:100%;padding:12px;
  background:#fff;color:#1A1930;
  border:1px solid #E4E2DC;border-radius:12px;
  font-family:'Noto Sans KR',sans-serif;
  font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-link:hover{background:#F5F4F1}

.btn-retry{
  width:100%;padding:11px;
  background:transparent;color:#888;
  border:none;font-family:'Noto Sans KR',sans-serif;
  font-size:13px;cursor:pointer;margin-top:4px;
}
.btn-retry:hover{color:#1A1930}

/* 인트로 화면 */
.intro{padding:32px 24px 28px;text-align:center}
.intro-badge{display:inline-block;background:#EEEDFE;color:#3C3489;font-size:11px;font-weight:500;padding:4px 12px;border-radius:20px;letter-spacing:0.1em;margin-bottom:16px}
.intro-title{font-size:22px;font-weight:500;color:#1A1930;line-height:1.4;margin-bottom:10px}
.intro-desc{font-size:14px;color:#666;line-height:1.7;margin-bottom:24px}
.intro-meta{display:flex;justify-content:center;gap:20px;margin-bottom:28px}
.im{font-size:12px;color:#888;display:flex;align-items:center;gap:4px}
.im-dot{width:5px;height:5px;border-radius:50%;background:#1D9E75}
.start-btn{
  width:100%;padding:14px;
  background:#1A1930;color:#fff;
  border:none;border-radius:12px;
  font-family:'Noto Sans KR',sans-serif;
  font-size:15px;font-weight:500;cursor:pointer;
  letter-spacing:0.04em;
}
.start-btn:hover{background:#26215C}

/* 공유 결과 배너 */
.shared-banner{
  margin:0 24px 0;
  background:#E1F5EE;border:1px solid #9FE1CB;
  border-radius:10px;padding:10px 14px;
  font-size:12px;color:#085041;
  display:none;align-items:center;gap:6px;
}
.sb-dot{width:6px;height:6px;border-radius:50%;background:#1D9E75;flex-shrink:0}
</style>
</head>

<script>

  {t:"최저임금을 지금보다 빠르게 올려야 한다.", opts:["강하게 찬성","대체로 찬성","대체로 반대","강하게 반대"], ax:"p", sc:[2,1,-1,-2]},

  PI: {name:"자유 진보형", badge:"진보 · 개인", desc:"개인의 자유와 권리를 최우선으로 하면서 경제적 평등도 추구합니다. 다양성을 존중하고 개인 선택을 중시합니다.", bg:"#E6F1FB", border:"#B5D4F4", badgeColor:"#185FA5", nameColor:"#0C447C", descColor:"#185FA5", topics:[["동성혼 법제화 찬반","hot"],["안락사 합법화","fit"],["사형제 폐지","fit"]], dotColor:"#378ADD"},
  CC: {name:"공동체 보수형", badge:"보수 · 공동체", desc:"전통적 가치와 사회 질서를 중시하면서 공동체의 결속을 강조합니다. 안정과 통합을 통한 발전을 추구합니다.", bg:"#FAECE7", border:"#F5C4B3", badgeColor:"#993C1D", nameColor:"#712B13", descColor:"#993C1D", topics:[["대통령제 vs 내각제","hot"],["국가보안법 존폐","fit"],["핵무장 자체 보유","fit"]], dotColor:"#D85A30"},
  CI: {name:"자유 보수형", badge:"보수 · 개인", desc:"시장 자율과 개인의 책임을 중시하는 고전적 자유주의 성향입니다. 작은 정부와 규제 완화를 통한 성장을 선호합니다.", bg:"#F1EFE8", border:"#D3D1C7", badgeColor:"#5F5E5A", nameColor:"#2C2C2A", descColor:"#5F5E5A", topics:[["기업 규제 완화 찬반","hot"],["부동산 세금 정책","fit"],["공기업 민영화","fit"]], dotColor:"#888780"}
};

const MATCHES = ["11%","17%","23%","28%","31%","34%","38%","42%"];

let cur=0, ans=[], scores={p:0,c:0};

function startTest(){
  document.getElementById('introWrap').style.display='none';
  document.getElementById('progWrap').style.display='block';
  document.getElementById('qBody').style.display='block';
  document.getElementById('navRow').style.display='flex';
  renderQ();
}

function renderQ(){
  const q=QS[cur];
  document.getElementById('qNum').textContent='Q'+(cur+1);
  document.getElementById('qText').textContent=q.t;
  document.getElementById('progFill').style.width=Math.max(Math.round((cur/QS.length)*100),3)+'%';
  document.getElementById('progLabel').textContent=(cur+1)+' / '+QS.length;
  document.getElementById('backBtn').style.visibility=cur===0?'hidden':'visible';
  const wrap=document.getElementById('optsWrap');
  wrap.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(ans[cur]===i?' sel':'');
    b.textContent=o;
    b.onclick=()=>pick(i);
    wrap.appendChild(b);
  });
}

function pick(i){
  ans[cur]=i;
  document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===i));
  setTimeout(()=>{
    cur++;
    if(cur>=QS.length) doAnalyze();
    else renderQ();
  },300);
}

function goBack(){
  if(cur>0){cur--;renderQ();}
}

function doAnalyze(){
  document.getElementById('qBody').style.display='none';
  document.getElementById('navRow').style.display='none';
  document.getElementById('progWrap').style.display='none';
  document.getElementById('loadingWrap').style.display='block';
  scores={p:0,c:0};
  ans.forEach((a,i)=>{const q=QS[i];scores[q.ax]+=q.sc[a];});
  setTimeout(showResult,1800);
}

function showResult(){
  document.getElementById('loadingWrap').style.display='none';

  const maxV=10;
  const progPct=Math.round(((scores.p+maxV)/(maxV*2))*100);
  const commPct=Math.round(((scores.c+maxV)/(maxV*2))*100);
  const isP=scores.p>=0, isC=scores.c>=0;
  const typeKey=(isP?'P':'C')+(isC?'C':'I');
  const T=TYPES[typeKey];

  const svgX=Math.min(Math.max(Math.round(260*(1-(progPct/100))),16),244);
  const svgY=Math.min(Math.max(Math.round(260*(commPct/100)),16),244);
  document.getElementById('rDot').setAttribute('cx',svgX);
  document.getElementById('rDot').setAttribute('cy',svgY);
  document.getElementById('rDot').setAttribute('fill',T.dotColor);
  document.getElementById('rDotPulse').setAttribute('cx',svgX);
  document.getElementById('rDotPulse').setAttribute('cy',svgY);
  document.getElementById('rDotPulse').setAttribute('stroke',T.dotColor);
  document.getElementById('rDotPulse').setAttribute('opacity','1');
  document.getElementById('rDotLbl').setAttribute('x',svgX);
  document.getElementById('rDotLbl').setAttribute('y',svgY-12);

  const tc=document.getElementById('typeCard');
  tc.style.background=T.bg; tc.style.border='1px solid '+T.border;
  const badge=document.getElementById('tcBadge');
  badge.textContent=T.badge; badge.style.color=T.badgeColor;
  const nm=document.getElementById('tcName');
  nm.textContent=T.name; nm.style.color=T.nameColor;
  const ds=document.getElementById('tcDesc');
  ds.textContent=T.desc; ds.style.color=T.descColor;

  document.getElementById('sProgressive').textContent=isP?progPct+'%':(100-progPct)+'%';
  document.getElementById('sCommunity').textContent=isC?commPct+'%':(100-commPct)+'%';
  document.getElementById('sMatch').textContent=MATCHES[Math.floor(Math.random()*MATCHES.length)];

  const tl=document.getElementById('topicList');
  tl.innerHTML='';
  T.topics.forEach(([title,badge])=>{
    const d=document.createElement('div');
    d.className='ts-item';
    d.innerHTML=`<span>${title}</span><span class="ts-badge badge-${badge}">${badge==='hot'?'인기':'추천'}</span>`;
    tl.appendChild(d);
  });

  const resultParam=btoa(encodeURIComponent(JSON.stringify({type:typeKey,p:progPct,c:commPct,x:svgX,y:svgY})));
  const shareURL=window.location.href.split('?')[0]+'?r='+resultParam;
  document.getElementById('shareLinkText').textContent=shareURL;
  window._shareURL=shareURL;
  window._shareType=T.name;

  document.getElementById('resultWrap').style.display='block';

  if(window.location.search.includes('?r=')){
    const banner=document.getElementById('sharedBanner');
    banner.style.display='flex';
    banner.style.marginTop='16px';
    document.getElementById('sharedText').textContent='친구가 공유한 결과예요. 나도 테스트해볼까요?';
  }
}

function copyLink(){
  const url=window._shareURL||window.location.href;
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(()=>{
      const btn=document.getElementById('copyBtn');
      btn.textContent='복사됨'; btn.classList.add('copied');
      setTimeout(()=>{btn.textContent='복사';btn.classList.remove('copied');},2000);
    });
  } else {
    const el=document.createElement('textarea');
    el.value=url; document.body.appendChild(el);
    el.select(); document.execCommand('copy');
    document.body.removeChild(el);
    const btn=document.getElementById('copyBtn');
    btn.textContent='복사됨'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='복사';btn.classList.remove('copied');},2000);
  }
}

function shareNative(){
  const url=window._shareURL||window.location.href;
  const type=window._shareType||'정치 성향';
  if(navigator.share){
    navigator.share({title:'나의 정치 성향 지도 — VRSUS',text:`나는 "${type}" 유형이래요! 당신의 정치 성향도 확인해보세요.`,url:url});
  } else {
    copyLink();
    alert('링크가 복사되었습니다. 원하는 곳에 붙여넣기 하세요!');
  }
}

function shareKakao(){
  const url=window._shareURL||window.location.href;
  const type=window._shareType||'정치 성향';
  const kakaoURL='https://story.kakao.com/share?url='+encodeURIComponent(url)+'&text='+encodeURIComponent('나는 VRSUS에서 "'+type+'" 유형이 나왔어요! 당신의 정치 성향도 확인해보세요.');
  window.open(kakaoURL,'_blank','width=560,height=600');
}

function restart(){
  cur=0;ans=[];scores={p:0,c:0};
  document.getElementById('resultWrap').style.display='none';
  document.getElementById('introWrap').style.display='block';
}

// URL에 결과 파라미터가 있으면 바로 결과 표시
(function(){
  const params=new URLSearchParams(window.location.search);
  const r=params.get('r');
  if(r){
    try{
      const data=JSON.parse(decodeURIComponent(atob(r)));
      const T=TYPES[data.type];
      if(!T) return;
      document.getElementById('introWrap').style.display='none';
      scores={p:data.p>=50?data.p-50:(50-data.p)*-1, c:data.c>=50?data.c-50:(50-data.c)*-1};
      setTimeout(()=>{
        document.getElementById('loadingWrap').style.display='block';
        setTimeout(showResult,800);
      },100);
    }catch(e){}
  }
})();
</script>
</body>
</html>
