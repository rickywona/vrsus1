<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta property="og:title" content="나는 조선의 어떤 인물? — VRSUS">
<meta property="og:description" content="12개 질문으로 조선시대 내 직업군을 알아보세요. 어사? 협객? 거상? 지금 확인하세요!">
<meta property="og:image" content="https://placehold.co/600x315/1A1205/F5E6C8?text=VRSUS+%EC%A1%B0%EC%84%A0+%EC%84%B1%ED%96%A5+%ED%85%8C%EC%8A%A4%ED%8A%B8">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>나는 조선의 어떤 인물? — VRSUS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FBF6EC;
  --paper2:#F5EDD8;
  --ink:#1A1205;
  --ink2:#3D2B1A;
  --ink3:#6B4C2A;
  --red:#8B1A1A;
  --gold:#8B6914;
  --blue:#1A3A5C;
  --teal:#1A4A3A;
  --border:#C8A96E;
  --border2:#E8D5A8;
}
html{background:#2C1A0A;min-height:100%}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:#2C1A0A;
  min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;
  padding:1.5rem 1rem 4rem;
}
.card{
  width:100%;max-width:460px;
  background:var(--paper);
  border-radius:4px;
  border:1px solid var(--border);
  overflow:hidden;
  position:relative;
}
.card::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(200,169,110,0.08) 31px,rgba(200,169,110,0.08) 32px);
  pointer-events:none;z-index:0;
}

/* 상단 헤더 */
.top-bar{
  background:var(--ink);
  padding:16px 20px 14px;
  position:relative;z-index:1;
  border-bottom:3px solid var(--gold);
}
.tb-inner{display:flex;align-items:center;justify-content:space-between}
.brand{
  font-family:'Bebas Neue',sans-serif;
  font-size:24px;color:#F5E6C8;letter-spacing:0.14em;
}
.brand span{color:#C8A96E}
.tb-right{text-align:right}
.tb-title{font-family:'Noto Serif KR',serif;font-size:13px;color:#C8A96E;letter-spacing:0.06em}
.tb-sub{font-size:10px;color:rgba(245,230,200,0.4);letter-spacing:0.1em;margin-top:2px}

/* 도장 장식 */
.seal{
  width:44px;height:44px;border-radius:4px;
  background:var(--red);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.seal-text{
  font-family:'Noto Serif KR',serif;
  font-size:11px;font-weight:600;
  color:#F5E6C8;letter-spacing:0.05em;
  text-align:center;line-height:1.3;
}

/* 인트로 */
.intro{padding:28px 24px 24px;position:relative;z-index:1;text-align:center}
.intro-deco{
  font-family:'Noto Serif KR',serif;
  font-size:11px;color:var(--gold);
  letter-spacing:0.3em;margin-bottom:16px;
}
.intro-title{
  font-family:'Noto Serif KR',serif;
  font-size:21px;font-weight:600;
  color:var(--ink);line-height:1.45;
  margin-bottom:10px;
}
.intro-desc{
  font-size:13px;color:var(--ink3);
  line-height:1.75;margin-bottom:22px;
}
.intro-meta{
  display:flex;justify-content:center;gap:18px;
  margin-bottom:24px;
  padding:12px 0;
  border-top:1px solid var(--border2);
  border-bottom:1px solid var(--border2);
}
.im{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.im-dot{width:4px;height:4px;border-radius:50%;background:var(--gold)}

.divider-ornament{
  text-align:center;font-size:14px;color:var(--border);
  margin:14px 0;letter-spacing:8px;
}

.start-btn{
  width:100%;padding:13px;
  background:var(--ink);color:#F5E6C8;
  border:2px solid var(--gold);
  border-radius:3px;
  font-family:'Noto Serif KR',serif;
  font-size:15px;font-weight:500;cursor:pointer;
  letter-spacing:0.1em;
  transition:background .15s;
}
.start-btn:hover{background:var(--ink2)}

/* 진행바 */
.prog-wrap{padding:12px 20px 0;position:relative;z-index:1}
.prog-bg{height:3px;background:var(--border2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s ease}
.prog-label{font-size:11px;color:var(--ink3);margin-top:5px;text-align:right;font-family:'Noto Serif KR',serif}

/* 질문 */
.q-body{padding:20px 24px 12px;position:relative;z-index:1}
.q-num{
  font-family:'Noto Serif KR',serif;
  font-size:10px;font-weight:500;color:var(--gold);
  letter-spacing:0.2em;text-transform:uppercase;margin-bottom:8px;
}
.q-text{
  font-family:'Noto Serif KR',serif;
  font-size:16px;font-weight:500;
  color:var(--ink);line-height:1.65;margin-bottom:18px;
}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  width:100%;padding:11px 14px;
  border:1px solid var(--border2);
  border-radius:3px;
  background:rgba(255,255,255,0.5);
  font-family:'Noto Sans KR',sans-serif;
  font-size:13px;color:var(--ink2);
  text-align:left;cursor:pointer;
  transition:all .15s;line-height:1.45;
}
.opt:hover{background:rgba(200,169,110,0.15);border-color:var(--border)}
.opt.sel{background:rgba(139,105,20,0.12);border-color:var(--gold);color:var(--ink)}

.nav-row{
  padding:8px 24px 18px;
  display:flex;justify-content:space-between;align-items:center;
  position:relative;z-index:1;
}
.back-btn{
  font-size:12px;color:var(--ink3);
  background:none;border:none;cursor:pointer;
  font-family:'Noto Serif KR',serif;
}
.back-btn:hover{color:var(--ink)}

/* 로딩 */
.loading{
  padding:52px 24px;text-align:center;
  display:none;position:relative;z-index:1;
}
.loading-char{
  font-size:48px;margin-bottom:14px;
  animation:float 2s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.loading p{
  font-family:'Noto Serif KR',serif;
  font-size:14px;color:var(--ink3);
  line-height:1.7;
}

/* 결과 */
.result{display:none;position:relative;z-index:1}

.result-hero{
  padding:24px 24px 0;text-align:center;
}
.rh-label{
  font-family:'Noto Serif KR',serif;
  font-size:11px;color:var(--gold);
  letter-spacing:0.22em;margin-bottom:14px;
}
.rh-char{
  font-size:72px;margin-bottom:8px;
  display:block;
  animation:float 3s ease-in-out infinite;
}
.rh-job{
  font-family:'Noto Serif KR',serif;
  font-size:26px;font-weight:700;
  color:var(--ink);margin-bottom:6px;
  letter-spacing:0.04em;
}
.rh-sub{
  font-size:12px;color:var(--ink3);
  letter-spacing:0.16em;margin-bottom:14px;
}
.rh-quote{
  font-family:'Noto Serif KR',serif;
  font-size:14px;color:var(--ink2);
  line-height:1.75;
  padding:14px 16px;
  background:rgba(200,169,110,0.12);
  border-left:3px solid var(--gold);
  border-radius:0 3px 3px 0;
  text-align:left;
  margin-bottom:16px;
}

.trait-row{
  display:flex;gap:6px;padding:0 24px;
  margin-bottom:14px;flex-wrap:wrap;justify-content:center;
}
.trait-pill{
  font-size:11px;font-weight:500;
  padding:4px 12px;border-radius:20px;
  border:1px solid var(--border);
  background:rgba(200,169,110,0.1);
  color:var(--ink3);font-family:'Noto Serif KR',serif;
  letter-spacing:0.06em;
}

.stat-section{
  margin:0 24px 14px;
  border:1px solid var(--border2);
  border-radius:3px;overflow:hidden;
}
.stat-head{
  background:var(--paper2);
  padding:8px 14px;
  font-family:'Noto Serif KR',serif;
  font-size:11px;color:var(--gold);
  letter-spacing:0.14em;
  border-bottom:1px solid var(--border2);
}
.stat-bars{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sbar-row{display:flex;align-items:center;gap:8px}
.sbar-label{font-size:11px;color:var(--ink3);width:52px;flex-shrink:0;font-family:'Noto Serif KR',serif}
.sbar-track{flex:1;height:6px;background:var(--border2);border-radius:3px;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px;transition:width 1s ease}
.sbar-pct{font-size:11px;color:var(--ink3);width:32px;text-align:right;flex-shrink:0}

.rival-section{
  margin:0 24px 14px;
  background:var(--paper2);
  border:1px solid var(--border2);
  border-radius:3px;padding:12px 14px;
}
.rival-label{
  font-size:10px;color:var(--gold);
  letter-spacing:0.16em;
  font-family:'Noto Serif KR',serif;
  margin-bottom:8px;
}
.rival-row{display:flex;gap:8px}
.rival-card{
  flex:1;border:1px solid var(--border2);
  border-radius:3px;padding:8px 10px;
  text-align:center;background:rgba(255,255,255,0.5);
}
.rc-emoji{font-size:22px;display:block;margin-bottom:3px}
.rc-name{font-size:11px;font-weight:500;color:var(--ink);font-family:'Noto Serif KR',serif}
.rc-rel{font-size:10px;color:var(--ink3);margin-top:2px}

.topics-section{
  margin:0 24px 14px;
  border:1px solid var(--border2);border-radius:3px;overflow:hidden;
}
.ts-head{
  padding:8px 14px;background:var(--paper2);
  font-family:'Noto Serif KR',serif;
  font-size:11px;color:var(--gold);
  letter-spacing:0.14em;
  border-bottom:1px solid var(--border2);
}
.ts-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-top:1px solid var(--border2);
  font-size:13px;color:var(--ink);
}
.ts-item:first-child{border-top:none}
.ts-badge{
  font-size:10px;font-weight:500;
  padding:2px 8px;border-radius:10px;
  flex-shrink:0;
}
.badge-hot{background:#FAECE7;color:#712B13}
.badge-fit{background:#EEEDFE;color:#3C3489}

/* 공유 */
.share-section{padding:0 24px 28px}
.share-title{
  font-family:'Noto Serif KR',serif;
  font-size:11px;color:var(--gold);
  letter-spacing:0.16em;
  margin-bottom:10px;text-align:center;
}
.share-link-wrap{
  display:flex;align-items:center;gap:8px;
  background:var(--paper2);
  border:1px solid var(--border2);
  border-radius:3px;padding:9px 12px;
  margin-bottom:10px;
}
.share-link-text{
  flex:1;font-size:11px;color:var(--ink3);
  overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-family:monospace;
}
.copy-btn{
  flex-shrink:0;padding:5px 10px;
  background:var(--ink);color:#F5E6C8;
  border:none;border-radius:3px;
  font-size:11px;font-weight:500;
  font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;transition:background .15s;
}
.copy-btn:hover{background:var(--ink2)}
.copy-btn.copied{background:var(--teal)}

.share-btns{display:flex;flex-direction:column;gap:7px}
.btn-kakao{
  width:100%;padding:12px;
  background:#FEE500;color:#1A1A1A;
  border:none;border-radius:3px;
  font-family:'Noto Sans KR',sans-serif;
  font-size:14px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-kakao:hover{background:#F5DB00}
.btn-native{
  width:100%;padding:11px;
  background:rgba(255,255,255,0.6);color:var(--ink);
  border:1px solid var(--border);border-radius:3px;
  font-family:'Noto Sans KR',sans-serif;
  font-size:13px;cursor:pointer;
}
.btn-native:hover{background:var(--paper2)}
.btn-retry{
  width:100%;padding:10px;
  background:transparent;color:var(--ink3);
  border:none;font-family:'Noto Serif KR',serif;
  font-size:13px;cursor:pointer;margin-top:2px;
}
.btn-retry:hover{color:var(--ink)}

.shared-banner{
  margin:0 24px 14px;
  background:#E1F5EE;border:1px solid #9FE1CB;
  border-radius:3px;padding:9px 12px;
  font-size:12px;color:#085041;
  display:none;align-items:center;gap:6px;
}
</style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <div class="tb-inner">
      <div>
        <div class="brand">VR<span>S</span>US</div>
        <div class="tb-right">
          <div class="tb-title">조선의 인물 성향 테스트</div>
          <div class="tb-sub">JOSEON CHARACTER TYPE</div>
        </div>
      </div>
      <div class="seal"><div class="seal-text">性向<br>判定</div></div>
    </div>
  </div>

  <!-- 인트로 -->
  <div class="intro" id="introWrap">
    <div class="intro-deco">⊱ 성향 판정 ⊰</div>
    <div class="intro-title">나는 조선시대에<br>어떤 인물이었을까?</div>
    <div class="intro-desc">
      12개의 질문으로<br>
      조선의 8가지 직업군 중<br>
      나의 성향과 가장 가까운 인물을 찾아드립니다.
    </div>
    <div class="intro-meta">
      <div class="im"><div class="im-dot"></div>약 3분 소요</div>
      <div class="im"><div class="im-dot"></div>12개 질문</div>
      <div class="im"><div class="im-dot"></div>8가지 유형</div>
    </div>
    <div class="divider-ornament">— ✦ —</div>
    <button class="start-btn" onclick="startTest()">판정 시작하기</button>
  </div>

  <!-- 진행바 -->
  <div class="prog-wrap" id="progWrap" style="display:none">
    <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:4%"></div></div>
    <div class="prog-label" id="progLabel">제 1문 / 총 12문</div>
  </div>

  <!-- 질문 -->
  <div class="q-body" id="qBody" style="display:none">
    <div class="q-num" id="qNum">第一問</div>
    <div class="q-text" id="qText"></div>
    <div class="opts" id="optsWrap"></div>
  </div>
  <div class="nav-row" id="navRow" style="display:none">
    <button class="back-btn" id="backBtn" onclick="goBack()">← 이전 문항</button>
    <span style="font-size:11px;color:var(--border)" id="navHint"></span>
  </div>

  <!-- 로딩 -->
  <div class="loading" id="loadingWrap">
    <div class="loading-char">📜</div>
    <p>
      그대의 성향을<br>
      판정하는 중이옵니다...
    </p>
  </div>

  <!-- 결과 -->
  <div class="result" id="resultWrap">
    <div class="result-hero">
      <div class="rh-label">그대의 유형은</div>
      <span class="rh-char" id="rhChar"></span>
      <div class="rh-job" id="rhJob"></div>
      <div class="rh-sub" id="rhSub"></div>
      <div class="rh-quote" id="rhQuote"></div>
    </div>

    <div class="trait-row" id="traitRow"></div>

    <div class="stat-section">
      <div class="stat-head">성향 분석</div>
      <div class="stat-bars" id="statBars"></div>
    </div>

    <div class="rival-section">
      <div class="rival-label">유형 궁합</div>
      <div class="rival-row" id="rivalRow"></div>
    </div>

    <div class="topics-section">
      <div class="ts-head">추천 VRSUS 토론</div>
      <div id="topicList"></div>
    </div>

    <div class="shared-banner" id="sharedBanner">
      <span>👀</span>
      <span>친구가 공유한 결과예요. 나도 판정받아 볼까요?</span>
    </div>

    <div class="share-section">
      <div class="share-title">— 결과 공유하기 —</div>
      <div class="share-link-wrap">
        <span class="share-link-text" id="shareLinkText"></span>
        <button class="copy-btn" id="copyBtn" onclick="copyLink()">복사</button>
      </div>
      <div class="share-btns">
        <button class="btn-kakao" onclick="shareKakao()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1A1A1A"><path d="M12 3C6.48 3 2 6.69 2 11.25c0 2.91 1.82 5.47 4.58 6.96L5.5 21l4.13-2.16A11.6 11.6 0 0012 19.5c5.52 0 10-3.69 10-8.25S17.52 3 12 3z"/></svg>
          카카오톡으로 공유하기
        </button>
        <button class="btn-native" onclick="shareNative()">🔗 링크 공유하기</button>
        <button class="btn-retry" onclick="restart()">다시 판정받기</button>
      </div>
    </div>
  </div>
</div>

<script>
const QS = [
  {
    t:"불의한 일을 목격했을 때 나는",
    opts:["즉시 나서서 바로잡는다","상황을 살핀 후 행동한다","조용히 해결책을 모색한다","일단 피하고 나중에 대처한다"],
    ax:"g", sc:[2,1,-1,-2]
  },
  {
    t:"나에게 가장 중요한 것은",
    opts:["공동체의 안녕과 평화","개인의 자유와 독립","나라의 전통과 질서","실리와 현실적 이득"],
    ax:"pc", sc_map:[[0,2],[0,-2],[1,2],[1,-2]]
  },
  {
    t:"새로운 제도와 변화에 대해 나는",
    opts:["적극적으로 환영한다","신중하게 검토 후 수용한다","검증된 것만 받아들인다","변화 자체를 경계한다"],
    ax:"p", sc:[2,1,-1,-2]
  },
  {
    t:"사람들과 함께 있을 때 나는",
    opts:["모두를 아우르는 역할을 한다","필요할 때만 함께한다","든든하게 뒤를 지킨다","나의 이익을 조용히 챙긴다"],
    ax:"c", sc:[2,-1,1,-2]
  },
  {
    t:"억울한 백성이 있다면",
    opts:["직접 나서서 해결해준다","절차에 따라 도움을 준다","기존 법도 안에서 해결한다","나와 관련이 없으면 관여 안 한다"],
    ax:"p", sc:[2,1,-1,-2]
  },
  {
    t:"권력과 나의 관계는",
    opts:["권력을 개혁의 도구로 쓴다","권력보다 사람이 먼저다","권력으로 나라를 지킨다","권력보다 재력이 실속 있다"],
    ax:"pc", sc_map:[[0,1],[0,-1],[1,1],[1,-1]]
  },
  {
    t:"친구가 잘못된 길을 가고 있다면",
    opts:["직접적으로 충고한다","돌아서 생각할 시간을 준다","모범을 보여 스스로 깨닫게 한다","각자의 선택을 존중한다"],
    ax:"g", sc:[2,0,-1,-2]
  },
  {
    t:"내가 꿈꾸는 이상적인 나라는",
    opts:["모두가 평등한 세상","개인이 자유로운 세상","전통이 살아있는 안정된 세상","능력 있는 자가 잘 사는 세상"],
    ax:"pc", sc_map:[[0,2],[0,-2],[1,2],[1,-2]]
  },

const HAN_NUMS = ["一","二","三","四","五","六","七","八","九","十","十一","十二"];

let cur=0, ans=[], scores={p:0, c:0, g:0};
let forcedJob = null;

function startTest(){
  document.getElementById('introWrap').style.display='none';
  document.getElementById('progWrap').style.display='block';
  document.getElementById('qBody').style.display='block';
  document.getElementById('navRow').style.display='flex';
  renderQ();
}

function renderQ(){
  const q = QS[cur];
  document.getElementById('qNum').textContent = '第' + HAN_NUMS[cur] + '問';
  document.getElementById('qText').textContent = q.t;
  const pct = Math.max(Math.round((cur / QS.length) * 100), 4);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = '제 ' + (cur+1) + '문 / 총 ' + QS.length + '문';
  document.getElementById('backBtn').style.visibility = cur === 0 ? 'hidden' : 'visible';
  const wrap = document.getElementById('optsWrap');
  wrap.innerHTML = '';
  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt' + (ans[cur] === i ? ' sel' : '');
    b.textContent = o;
    b.onclick = () => pick(i);
    wrap.appendChild(b);
  });
}

function pick(i){
  ans[cur] = i;
  document.querySelectorAll('.opt').forEach((b,j) => b.classList.toggle('sel', j===i));
  setTimeout(() => {
    cur++;
    if(cur >= QS.length) doAnalyze();
    else renderQ();
  }, 300);
}

function goBack(){
  if(cur > 0){ cur--; renderQ(); }
}

function doAnalyze(){
  document.getElementById('qBody').style.display='none';
  document.getElementById('navRow').style.display='none';
  document.getElementById('progWrap').style.display='none';
  document.getElementById('loadingWrap').style.display='block';

  scores = {p:0, c:0, g:0};
  forcedJob = null;

  ans.forEach((a, i) => {
    const q = QS[i];
    if(q.ax === 'p') scores.p += q.sc[a];
    else if(q.ax === 'c') scores.c += q.sc[a];
    else if(q.ax === 'g') scores.g += q.sc[a];
    else if(q.ax === 'pc') {
      const [axis, val] = q.sc_map[a];
      if(axis === 0) scores.p += val;
      else scores.c += val;
    } else if(q.ax === 'mix') {
      const [axis, pv, cv] = q.sc_map[a];
      if(axis === 0) scores.p += pv;
      else scores.p -= Math.abs(pv);
      scores.c += cv;
    } else if(q.ax === 'mix2') {
      forcedJob = q.sc_map[a];
    }
  });

  setTimeout(showResult, 2000);
}

function getJobKey(){
  if(forcedJob) return forcedJob;
  const isP = scores.p >= 0;
  const isC = scores.c >= 0;
  const isG = scores.g >= 0;
  if(isP && isC && isG) return "어사";
  if(isP && isC && !isG) return "의원";
  if(isP && !isC && isG) return "협객";
  if(isP && !isC && !isG) return "서생";
  if(!isP && isC && isG) return "장군";
  if(!isP && isC && !isG) return "대감";
  if(!isP && !isC && isG) return "거상";
  return "선비";
}

function showResult(){
  document.getElementById('loadingWrap').style.display='none';

  const jobKey = getJobKey();
  const J = JOBS[jobKey];

  document.getElementById('rhChar').textContent = J.emoji;
  document.getElementById('rhJob').textContent = J.job;
  document.getElementById('rhSub').textContent = J.sub;
  document.getElementById('rhQuote').textContent = J.quote;

  const tr = document.getElementById('traitRow');
  tr.innerHTML = '';
  J.traits.forEach(t => {
    const p = document.createElement('div');
    p.className = 'trait-pill';
    p.textContent = t;
    tr.appendChild(p);
  });

  const sb = document.getElementById('statBars');
  sb.innerHTML = '';
  J.bars.forEach(b => {
    const row = document.createElement('div');
    row.className = 'sbar-row';
    row.innerHTML = `
      <div class="sbar-label">${b.l}</div>
      <div class="sbar-track"><div class="sbar-fill" style="width:0%;background:${b.c}" data-val="${b.v}"></div></div>
      <div class="sbar-pct">${b.v}%</div>
    `;
    sb.appendChild(row);
  });

  const rr = document.getElementById('rivalRow');
  rr.innerHTML = `
    <div class="rival-card">
      <span class="rc-emoji">${J.ally.emoji}</span>
      <div class="rc-name">${J.ally.name}</div>
      <div class="rc-rel">${J.ally.rel}</div>
    </div>
    <div class="rival-card">
      <span class="rc-emoji">${J.rival.emoji}</span>
      <div class="rc-name">${J.rival.name}</div>
      <div class="rc-rel">${J.rival.rel}</div>
    </div>
  `;

  const tl = document.getElementById('topicList');
  tl.innerHTML = '';
  J.topics.forEach(([title, badge]) => {
    const d = document.createElement('div');
    d.className = 'ts-item';
    d.innerHTML = `<span>${title}</span><span class="ts-badge badge-${badge}">${badge==='hot'?'인기':'추천'}</span>`;
    tl.appendChild(d);
  });

  const resultParam = btoa(encodeURIComponent(JSON.stringify({job: jobKey})));
  const shareURL = window.location.href.split('?')[0] + '?r=' + resultParam;
  document.getElementById('shareLinkText').textContent = shareURL;
  window._shareURL = shareURL;
  window._shareJob = J.job;
  window._shareEmoji = J.emoji;

  document.getElementById('resultWrap').style.display = 'block';

  setTimeout(() => {
    document.querySelectorAll('.sbar-fill').forEach(el => {
      el.style.transition = 'width 1s ease';
      el.style.width = el.dataset.val + '%';
    });
  }, 200);

  if(window.location.search.includes('?r=')){
    const b = document.getElementById('sharedBanner');
    b.style.display = 'flex';
  }
}

function copyLink(){
  const url = window._shareURL || window.location.href;
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '복사됨'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 2000);
    });
  } else {
    const el = document.createElement('textarea');
    el.value = url; document.body.appendChild(el);
    el.select(); document.execCommand('copy'); document.body.removeChild(el);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '복사됨'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 2000);
  }
}

function shareKakao(){
  const url = window._shareURL || window.location.href;
  const job = window._shareJob || '조선의 인물';
  const emoji = window._shareEmoji || '📜';
  const kakaoURL = 'https://story.kakao.com/share?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(emoji + ' 나는 VRSUS에서 "' + job + '" 유형이 나왔어요! 당신은 조선의 어떤 인물인가요?');
  window.open(kakaoURL, '_blank', 'width=560,height=600');
}

function shareNative(){
  const url = window._shareURL || window.location.href;
  const job = window._shareJob || '조선의 인물';
  const emoji = window._shareEmoji || '📜';
  if(navigator.share){
    navigator.share({
      title: '나는 조선의 어떤 인물? — VRSUS',
      text: emoji + ' 나는 "' + job + '" 유형이래요! 당신은요?',
      url: url
    });
  } else {
    copyLink();
    alert('링크가 복사되었습니다!');
  }
}

function restart(){
  cur = 0; ans = []; scores = {p:0,c:0,g:0}; forcedJob = null;
  document.getElementById('resultWrap').style.display = 'none';
  document.getElementById('introWrap').style.display = 'block';
}

(function(){
  const params = new URLSearchParams(window.location.search);
  const r = params.get('r');
  if(r){
    try{
      const data = JSON.parse(decodeURIComponent(atob(r)));
      if(data.job && JOBS[data.job]){
        document.getElementById('introWrap').style.display = 'none';
        document.getElementById('loadingWrap').style.display = 'block';
        forcedJob = data.job;
        setTimeout(showResult, 1000);
      }
    } catch(e){}
  }
})();
